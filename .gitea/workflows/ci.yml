name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build & test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps (Bevy / serial)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets --verbose
      - name: Test
        run: cargo test --verbose
      # Advisory for now (matches RustyDeck): tighten to `-D warnings` after a
      # cleanup pass.
      - name: Format check (advisory)
        run: cargo fmt --all -- --check
        continue-on-error: true
      - name: Clippy (advisory)
        run: cargo clippy --all-targets
        continue-on-error: true

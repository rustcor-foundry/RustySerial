name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build & test (host)
    # ubuntu-latest is single-homed on gitea-runner-01 (pve1). Linux CI belongs
    # on lx-ws01, which is off pve1 and is the fleet's Linux build host.
    runs-on: [self-hosted, linux, lx-ws01]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps (Bevy / serial)
        run: |
          set -euo pipefail
          # lx-ws01 is a persistent host runner rather than a fresh container,
          # so these normally already exist. Only reach for apt when they do not.
          if ! pkg-config --exists alsa libudev; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              libasound2-dev libudev-dev pkg-config
          fi
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Pinned: v2.9.0+ migrated to node24, which act_runner v0.2.11 cannot run.
      # v2.8.2 is the last node20 release. Revert to @v2 once the runners are
      # upgraded.
      - uses: Swatinem/rust-cache@v2.8.2
        with:
          # lx-ws01 is a persistent host runner. rust-cache's save step otherwise
          # deletes every regular file in ~/.cargo/bin that is not a freshly
          # cargo-installed tool. On Linux the rustup proxies are hardlinks, so
          # that would remove cargo, rustc and rustup for every job on the box.
          # It did exactly that to rustup.exe on ws-ws01 on 2026-09-20.
          cache-bin: false
      - name: Build
        run: cargo build --all-targets --verbose
      - name: Test
        run: cargo test --verbose
      # Advisory for now (matches RustyDeck): tighten to `-D warnings` after a
      # cleanup pass.
      - name: Format check (advisory)
        run: cargo fmt --all -- --check
        continue-on-error: true
      - name: Clippy (advisory)
        run: cargo clippy --all-targets
        continue-on-error: true
